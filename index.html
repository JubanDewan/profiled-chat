<style>
:root{
  --bg:#F8FAFC; --panel:#FFFFFF; --in:#E9F7F4; --out:#00A884; --on-out:#0B141A; --alt:#1ABC9C;
  --text:#111827; --muted:#64748B; --line:#E2E8F0; --name:#00735F; --err:#C0392B;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0B141A; --panel:#111B21; --in:#202C33; --text:#E9EDEF; --muted:#8696A0; --line:#222E35; --name:#1ABC9C; --err:#FF8A7A; color-scheme:dark}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--name);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--out);color:var(--on-out)}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.icon{width:40px;height:40px;border:0;border-radius:50%;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.icon:hover{background:var(--in);color:var(--text)}
.field{display:block;margin-bottom:14px;font-size:14px;color:var(--muted)}
.field input,.field textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.err{color:var(--err);font-size:14px;min-height:20px;margin-bottom:10px}

/* Avatar */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none;user-select:none;background-size:cover;background-position:center}
.av.lg{width:56px;height:56px;font-size:24px}

/* Masuk / daftar */
.auth{height:100%;display:grid;place-items:center;padding:20px}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}
.card h1{font-size:22px;font-weight:700;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.card .btn{width:100%}

/* Aplikasi */
.app{display:grid;grid-template-columns:320px 1fr;height:100dvh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-h{display:flex;align-items:center;gap:6px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.me{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px;border-radius:12px;cursor:pointer;text-align:left}
.me:hover{background:var(--in)}
.me b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side h2{font-size:13px;font-weight:600;color:var(--muted);padding:16px 18px 6px}
#rooms{overflow-y:auto;padding:0 8px 12px;flex:1}
.room{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:500}
.room:hover{background:var(--in)}
.room.on{background:var(--in);font-weight:700}
.room i,.ric{background-size:cover;background-position:center;width:34px;height:34px;border-radius:10px;background:var(--in);color:var(--name);display:grid;place-items:center;font-style:normal;font-weight:700;flex:none}
.room.on i{background:var(--out);color:var(--on-out)}
.room span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.chat header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:62px}
.chat h2{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{display:none}
#log{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px max(14px,env(safe-area-inset-right,0px)) 16px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;scrollbar-width:thin}
.note{margin:auto;color:var(--muted);text-align:center;font-size:14px;max-width:34ch}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:10px;max-width:min(78%,560px)}
.row.g{margin-top:2px}
.row.own{align-self:flex-end;flex-direction:row-reverse}
.sp{width:34px;flex:none}
.col{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.own .col{align-items:flex-end}
.who{font-size:12.5px;font-weight:600;color:var(--name);margin:0 6px 3px}
.bubble{display:flow-root;background:var(--in);padding:8px 12px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.own .bubble{background:var(--out);color:var(--on-out)}
.time{float:right;margin:8px 0 -3px 12px;font-size:11px;color:var(--muted);white-space:nowrap}
.own .time{color:rgba(11,20,26,.72)}
.send{display:flex;align-items:flex-end;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-top:1px solid var(--line)}
.send textarea{flex:1;resize:none;max-height:140px;line-height:1.4;padding:10px 16px;border-radius:22px;border:1px solid var(--line);background:var(--bg)}
.send .btn{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;flex:none}

dialog{margin:auto;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);padding:24px;width:min(380px,calc(100% - 32px))}
dialog::backdrop{background:rgba(8,12,16,.5)}
dialog h2{font-size:18px;margin-bottom:16px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px var(--panel)}
.sw button[aria-pressed=true]{border-color:var(--text)}
.pv{display:flex;align-items:center;gap:14px;margin-bottom:16px}

.ric.lg{width:56px;height:56px;font-size:24px;border-radius:14px}
.btn.sm{padding:7px 13px;font-size:14px;border-radius:10px}
.pvb{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 10px}
.bubble.dots{display:flex;gap:5px;align-items:center;padding:13px 14px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.room .badge{margin-left:auto;flex:none;min-width:22px;padding:1px 7px;border-radius:11px;background:var(--out);color:var(--on-out);font-size:12px;font-weight:700;text-align:center}
.room.unread span{font-weight:700}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;width:min(420px,calc(100% - 24px));display:block;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 8px 28px rgba(0,0,0,.22);cursor:pointer}
.toast b{display:block;font-size:13px;color:var(--name)}
.toast span{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble.hasimg{padding:4px}
.pic{display:block;max-width:min(320px,100%);height:auto;border-radius:12px;cursor:zoom-in;background:var(--bg)}
.hasimg .cap{padding:6px 8px 2px}
.cap{display:flow-root}
.prev{display:flex;align-items:center;gap:12px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-top:1px solid var(--line)}
.prev img{height:64px;max-width:120px;width:auto;border-radius:10px;object-fit:cover}
.prev span{flex:1;font-size:13px;color:var(--muted)}
#lb{padding:0;border:0;background:transparent;width:auto;max-width:100vw}
#lb::backdrop{background:rgba(0,0,0,.82)}
#lb img{display:block;max-width:min(94vw,900px);max-height:88dvh;border-radius:12px;cursor:zoom-out}
@media (max-width:759px){
  .app{grid-template-columns:1fr}
  .chat{display:none}
  body.in .side{display:none}
  body.in .chat{display:flex}
  #back{display:grid}
  .row{max-width:86%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.dots span{animation:none!important;opacity:.6}}
</style>
</head>
<body>

<div class="auth" id="auth" hidden>
  <div class="card">
    <h1>Selamat datang</h1>
    <p class="sub">Masukkan username untuk mulai.</p>
    <form id="authForm">
      <label class="field">Nama<input id="aName" maxlength="24" autocomplete="nickname" required autofocus></label>
      <p class="err" id="aErr" role="alert"></p>
      <button class="btn" id="aGo" type="submit">Mulai</button>
    </form>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side-h">
      <button class="me" id="meBtn" type="button" title="Ubah profil"><span id="meAv"></span><span style="min-width:0"><b id="meName"></b><small id="meBio"></small></span></button>
      <button class="icon" id="bellBtn" type="button" aria-pressed="false" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/><path id="bellSlash" d="M3 3l18 18"/></svg></button>
      
    </div>

    <div style="padding:12px"><button class="btn ghost" id="newBtn" type="button" style="width:100%">Buat room baru</button>
      <button class="btn ghost" id="installBtn" type="button" style="width:100%;margin-top:8px" hidden>Pasang aplikasi</button></div>
  </aside>
  <section class="chat">
    <header>
      <a class="icon" id="back" href="#" aria-label="Kembali"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <span class="ric" id="hIcon" hidden></span>
      <h2 id="title" style="flex:1;min-width:0">Obrolan</h2>
      <button class="icon" id="editRoom" type="button" title="Ubah room" aria-label="Ubah room" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </header>
    <main id="log" aria-live="polite"></main>
    <div class="prev" id="prev" hidden><img id="prevImg" alt="Pratinjau gambar"><span id="prevInfo"></span><button class="icon" id="prevX" type="button" aria-label="Hapus gambar" title="Hapus gambar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <form class="send" id="form" hidden>
      <button class="icon" id="attach" type="button" title="Kirim gambar" aria-label="Kirim gambar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>
      <input type="file" id="imgFile" accept="image/*" hidden>
      <textarea id="text" rows="1" maxlength="500" placeholder="Tulis pesan" aria-label="Pesan"></textarea>
      <button class="btn" id="sendBtn" type="submit" aria-label="Kirim" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6v6.5L15 12 3.4 13.9z"/></svg></button>
    </form>

</div>

<dialog id="lb"><img id="lbImg" alt="Gambar"></dialog>

<button class="toast" id="toast" type="button" role="status" hidden><b id="toastT"></b><span id="toastB"></span></button>

<dialog id="pDlg">
  <form id="pForm">
    <h2>Profil kamu</h2>
    <div class="pv"><span id="pAv"></span>
      <span class="pvb"><button class="btn ghost sm" type="button" id="pPick">Pilih foto</button><button class="btn ghost sm" type="button" id="pDel" hidden>Hapus foto</button></span>
    </div>
    <input type="file" id="pFile" accept="image/*" hidden>

<dialog id="rDlg">
  <form id="rForm">
    <h2 id="rTitle">Room baru</h2>
    <div class="pv"><span class="ric lg" id="rAv"></span>
      <span class="pvb"><button class="btn ghost sm" type="button" id="rPick">Pilih ikon</button><button class="btn ghost sm" type="button" id="rDel" hidden>Hapus ikon</button></span>
    </div>
    <input type="file" id="rFile" accept="image/*" hidden>
    <label class="field">Nama room<input id="rName" maxlength="30" placeholder="Contoh: Nongkrong" required></label>
    <p class="err" id="rErr" role="alert"></p>
    <div class="acts"><button class="btn ghost" type="button" id="rCancel">Batal</button><button class="btn" id="rGo" type="submit">Buat</button></div>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, query, orderBy, limit, limitToLast, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDGrsU8WsmF6QJ5p-CYU1yyLup7FZCJMMo",
  authDomain: "profiled-chat.firebaseapp.com",
  projectId: "profiled-chat",
  storageBucket: "profiled-chat.firebasestorage.app",
  messagingSenderId: "502631034180",
  appId: "1:502631034180:web:fe6bd48fc065f6b9bfbb11",
  measurementId: "G-31EHMFW9EP"
});
const auth = getAuth(app);
// Cache lokal: profil dan pesan yang pernah dibuka tetap terbaca saat koneksi putus
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch { db = getFirestore(app); }

const $ = id => document.getElementById(id);
const COLORS = ["#00A884", "#0E7C86", "#3B82F6", "#8B5CF6", "#D9468F", "#E26D2F", "#C0392B", "#64748B"];

let me = null, pendingName = null;
let rooms = [], room = null, unsubRooms = null, unsubMsgs = null, unsubTyp = null, last = null;
let typEl = null, typTimer = null, typLast = 0, typRoom = null;
const typists = new Map(), unread = new Map(), watchedRooms = new Map();
let pendingImg = null;

const initial = s => (Array.from((s || "?").trim())[0] || "?").toUpperCase();
// Hanya terima gambar data-URL kecil yang dibuat aplikasi ini
const safePhoto = p => (typeof p === "string" && p.length < 20000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p)) ? p : "";

// Gambar kiriman: hanya terima data-URL gambar berukuran wajar
const safeImage = p => (typeof p === "string" && p.length < 150000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p)) ? p : "";
function loadImg(file) {
  return new Promise((ok, fail) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error("gambar")); };
    img.src = url;
  });
}
// Kecilkan otomatis: sisi terpanjang maks 640 px, JPEG, usahakan di bawah ~90 KB
async function shrink(file) {
  const img = await loadImg(file);
  if (!img.naturalWidth || !img.naturalHeight) throw new Error("ukuran");
  let scale = Math.min(1, 640 / Math.max(img.naturalWidth, img.naturalHeight));
  for (let n = 0; n < 6; n++) {
    const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, w, h);
    x.imageSmoothingQuality = "high";
    x.drawImage(img, 0, 0, w, h);
    for (const q of [0.72, 0.6, 0.5, 0.4]) {
      const data = c.toDataURL("image/jpeg", q);
      if (data.length <= 90000) return { data, w, h };
    }
    scale *= 0.8;
  }
  throw new Error("terlalu besar");
}

function paintAv(d, name, color, photo) {
  d.style.backgroundColor = color || COLORS[0];
  if (photo) { d.style.backgroundImage = `url("${photo}")`; d.textContent = ""; }
  else { d.style.backgroundImage = ""; d.textContent = initial(name); }
}
function avatar(name, color, cls = "", uid = "", photo = "") {
  const d = document.createElement("div");
  d.className = "av " + cls;
  if (uid) d.dataset.uid = uid;
  paintAv(d, name, color, safePhoto(photo));
  return d;
}
function paintRic(el, photo) {
  photo = safePhoto(photo);
  el.style.backgroundImage = photo ? `url("${photo}")` : "";
  el.textContent = photo ? "" : "#";
}
// Perkecil gambar menjadi 96x96 JPEG (sekitar 4 KB) supaya muat di Firestore tanpa Firebase Storage
function thumbnail(file, size = 96, quality = 0.72) {
  return new Promise((ok, fail) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const w = img.naturalWidth, h = img.naturalHeight, m = Math.min(w, h);
      const c = document.createElement("canvas"); c.width = c.height = size;
      const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, size, size);
      x.imageSmoothingQuality = "high";
      x.drawImage(img, (w - m) / 2, (h - m) / 2, m, m, 0, 0, size, size);
      ok(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error("gambar")); };
    img.src = url;
  });
}

// Profil pengguna lain dibaca langsung agar nama dan foto selalu terbaru
const profiles = new Map(), watching = new Set();
function applyProfile(uid) {
  const p = profiles.get(uid); if (!p) return;
  const photo = safePhoto(p.photo), q = CSS.escape(uid);
  document.querySelectorAll(`.av[data-uid="${q}"]`).forEach(el => paintAv(el, p.name, p.color, photo));
  document.querySelectorAll(`.who[data-uid="${q}"]`).forEach(el => { el.textContent = p.name; });
}
function watchProfile(uid) {
  if (!uid || watching.has(uid)) return;
  watching.add(uid);
  onSnapshot(doc(db, "users", uid),
    s => { if (s.exists()) { profiles.set(uid, s.data()); applyProfile(uid); if (typists.has(uid)) paintTyping(); } },
    () => watching.delete(uid));
}

/* ---------- Pasang sebagai aplikasi ---------- */
const showInstall = () => { if (window.__bip) $("installBtn").hidden = false; };
showInstall(); addEventListener("bip", showInstall);
$("installBtn").onclick = async () => {
  const ev = window.__bip; if (!ev) return;
  ev.prompt(); await ev.userChoice.catch(() => {});
  window.__bip = null; $("installBtn").hidden = true;

addEventListener("appinstalled", () => { window.__bip = null; $("installBtn").hidden = true; });

/* ---------- Nama (tanpa email) ---------- */
function showWelcome(msg = "") {
  me = null; $("app").hidden = true; $("auth").hidden = false;
  $("aErr").textContent = msg; $("aGo").disabled = false; $("aName").focus();
}

async function load(u) {
  const ref = doc(db, "users", u.uid);
  try {
    let s = await getDoc(ref);
    if (!s.exists()) {
      if (!pendingName) return showWelcome();
      await setDoc(ref, {
        name: pendingName.slice(0, 24), bio: "",
        color: COLORS[Math.floor(Math.random() * COLORS.length)], createdAt: serverTimestamp()
      });
      s = await getDoc(ref);
    }
    me = { uid: u.uid, ...s.data() };
  } catch (err) {
    console.error(err); pendingName = null;
    return showWelcome("Tidak bisa terhubung ke database. Periksa koneksi dan rules Firestore.");
  }
  pendingName = null; start();
}

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();

  pendingName = name; $("aGo").disabled = true; $("aErr").textContent = "";

  } catch (err) {

// Firebase menyimpan sesi anonim di perangkat, jadi kunjungan berikutnya langsung masuk

/* ---------- Profil ---------- */

/* ---------- Room ---------- */
let rPhoto = "", rEdit = null;
const paintRPv = () => { paintRic($("rAv"), rPhoto); $("rDel").hidden = !rPhoto; };

$("newBtn").onclick = () => openRoomDlg(null);
$("editRoom").onclick = () => openRoomDlg(rooms.find(r => r.id === room));
$("rCancel").onclick = () => $("rDlg").close();
$("rPick").onclick = () => $("rFile").click();
$("rFile").onchange = async e => {

$("rForm").addEventListener("submit", async e => {

    }

function paintRooms() {
  $("rooms").replaceChildren(...rooms.map(r => {
    const a = document.createElement("a");
    a.className = "room" + (r.id === room ? " on" : "");
    a.href = "#" + r.id;
    const i = document.createElement("i"); paintRic(i, r.photo);
    const s = document.createElement("span"); s.textContent = r.name;
    a.append(i, s);
    const n = unread.get(r.id);
    if (n) { a.classList.add("unread"); const b = document.createElement("b"); b.className = "badge"; b.textContent = n > 99 ? "99+" : n; a.append(b); }

  }));

function showNote(msg) {
  const p = document.createElement("p"); p.className = "note"; p.id = "note"; p.textContent = msg;
  $("log").replaceChildren(p);
}

function route() {
  if (!me) return;
  const id = location.hash.slice(1);
  stopTyping();
  unsubMsgs?.(); unsubTyp?.(); unsubMsgs = unsubTyp = null; last = null;
  typists.forEach(t => clearTimeout(t.timer)); typists.clear(); typEl = null;
  pendingImg = null; paintPrev();
  room = id || null;
  if (id && unread.delete(id)) updateBadge();
  document.body.classList.toggle("in", !!id);
  $("form").hidden = !id;
  paintRooms();
  if (!id) { $("title").textContent = "Obrolan"; showNote("Pilih room di samping, atau buat room baru."); return; }
  showNote("Belum ada pesan di room ini. Mulai obrolan.");
  unsubMsgs = onSnapshot(
    query(collection(db, "rooms", id, "messages"), orderBy("ts"), limitToLast(100)),
    snap => snap.docChanges().forEach(c => { if (c.type === "added") render(c.doc.data({ serverTimestamps: "estimate" })); }),
    err => { console.error(err); showNote("Pesan tidak bisa dimuat. Periksa rules Firestore."); }
  );
  unsubTyp = onSnapshot(collection(db, "rooms", id, "typing"), snap => {
    snap.docChanges().forEach(c => {
      const uid = c.doc.id;
      if (uid === me.uid) return;
      if (c.type === "removed") { dropTyper(uid); return; }
      const d = c.doc.data({ serverTimestamps: "estimate" });
      const t = d.ts?.toMillis ? d.ts.toMillis() : Date.now();
      if (Date.now() - t > 20000) return; // sisa lama, abaikan
      clearTimeout(typists.get(uid)?.timer);
      typists.set(uid, { name: d.name, timer: setTimeout(() => dropTyper(uid), 6000) });
      watchProfile(uid);
    });
    paintTyping();
  }, () => {});
  if (matchMedia("(min-width:760px)").matches) $("text").focus();
}
addEventListener("hashchange", route);

function start() {
  $("auth").hidden = true; $("app").hidden = false;
  paintMe(); paintBell(); hintNotif();
  unsubRooms?.();
  let seeded = false;
  unsubRooms = onSnapshot(query(collection(db, "rooms"), orderBy("createdAt")), snap => {
    rooms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    rooms.forEach(r => watchRoomMsgs(r.id));
    if (!rooms.length && !seeded) {
      seeded = true;
      setDoc(doc(db, "rooms", "umum"), { name: "Umum", createdBy: me.uid, createdAt: serverTimestamp() }).catch(console.error);
    }
    if (!location.hash && rooms.length && matchMedia("(min-width:760px)").matches) {
      location.replace("#" + rooms[0].id);
    } else if (!room || !location.hash) { route(); } else { paintRooms(); }
  }, err => { console.error(err); $("rooms").textContent = "Room tidak bisa dimuat. Periksa rules Firestore."; });
  route();
}

/* ---------- Notifikasi pesan masuk ---------- */
const canNotify = "Notification" in window;
const getFlag = () => { try { return localStorage.getItem("chat:notif") === "1"; } catch { return false; } };
const setFlag = v => { try { localStorage.setItem("chat:notif", v ? "1" : "0"); } catch {} };
const notifEnabled = () => canNotify && getFlag() && Notification.permission === "granted";

function paintBell() {
  const on = notifEnabled();
  $("bellBtn").hidden = !canNotify;
  $("bellSlash").style.display = on ? "none" : "";
  $("bellBtn").setAttribute("aria-pressed", String(on));
  $("bellBtn").title = on ? "Notifikasi aktif (ketuk untuk mematikan)" : "Aktifkan notifikasi";
  $("bellBtn").setAttribute("aria-label", $("bellBtn").title);
}

let toastTimer = null, toastRoom = null;
function toast(title, body = "", roomId = null) {
  $("toastT").textContent = title; $("toastB").textContent = body; $("toastB").hidden = !body;
  toastRoom = roomId; $("toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; }, 4500);
}
$("toast").onclick = () => { $("toast").hidden = true; if (toastRoom) location.hash = toastRoom; };

let ac = null;
function unlockAudio() { try { ac ||= new (window.AudioContext || window.webkitAudioContext)(); ac.resume?.(); } catch {} }
addEventListener("pointerdown", unlockAudio, { once: true });
addEventListener("keydown", unlockAudio, { once: true });
function beep() {
  if (!ac || ac.state !== "running") return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1175, t + 0.1);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.26);
}

async function systemNotify(title, body, roomId) {
  const opts = { body, icon: "icon-192.png", tag: "room-" + roomId, renotify: true, data: { room: roomId } };
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) await reg.showNotification(title, opts); else new Notification(title, opts);
  } catch (err) { console.error(err); }
}

$("bellBtn").onclick = async () => {
  if (notifEnabled()) { setFlag(false); paintBell(); toast("Notifikasi dimatikan"); return; }
  if (Notification.permission === "denied") {
    toast("Notifikasi diblokir", "Izinkan lewat pengaturan situs di browser, lalu coba lagi."); return;
  }
  const p = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
  if (p === "granted") { setFlag(true); unlockAudio(); toast("Notifikasi aktif", "Kamu akan diberi tahu saat ada pesan baru."); }
  else toast("Izin tidak diberikan", "Notifikasi tetap mati.");
  paintBell();
};

function hintNotif() {
  if (!canNotify || Notification.permission !== "default") return;
  try { if (localStorage.getItem("chat:hint")) return; localStorage.setItem("chat:hint", "1"); } catch {}
  setTimeout(() => toast("Mau diberi tahu?", "Ketuk ikon lonceng untuk mengaktifkan notifikasi pesan baru."), 1500);
}

function updateBadge() {
  let n = 0; unread.forEach(v => { n += v; });
  document.title = n ? `(${n}) Obrolan` : "Obrolan";
  try { (n ? navigator.setAppBadge?.(n) : navigator.clearAppBadge?.())?.catch(() => {}); } catch {}
  if (me) paintRooms();
}
const seenNow = () => {
  if (room && unread.has(room) && document.visibilityState === "visible") { unread.delete(room); updateBadge(); }
};
document.addEventListener("visibilitychange", seenNow);
addEventListener("focus", seenNow);

function onIncoming(id, m) {
  if (!me || m.uid === me.uid) return;
  const visible = document.visibilityState === "visible" && document.hasFocus();
  if (visible && id === room) return; // sedang dibaca langsung
  unread.set(id, (unread.get(id) || 0) + 1);
  updateBadge();
  if (!notifEnabled()) return;
  const roomName = rooms.find(r => r.id === id)?.name || "Obrolan";
  const sender = profiles.get(m.uid)?.name || m.name || "Seseorang";
  const body = String(m.text ?? "").slice(0, 120) || (m.image ? "Mengirim gambar" : "");
  if (visible) { toast(`${sender} di ${roomName}`, body, id); beep(); }
  else systemNotify(roomName, `${sender}: ${body}`, id);
}

// Memantau pesan baru di semua room (bukan hanya room yang sedang dibuka)
function watchRoomMsgs(id) {
  if (watchedRooms.has(id)) return;
  let ready = false;
  watchedRooms.set(id, onSnapshot(
    query(collection(db, "rooms", id, "messages"), orderBy("ts", "desc"), limit(5)),
    snap => {
      if (snap.metadata.fromCache) return;   // hanya percaya data dari server
      if (!ready) { ready = true; return; }  // snapshot pertama = kondisi awal, bukan pesan baru
      snap.docChanges().forEach(c => {
        if (c.type === "added" && !c.doc.metadata.hasPendingWrites) onIncoming(id, c.doc.data());
      });
    },
    () => watchedRooms.delete(id)
  ));
}

// Ketuk notifikasi sistem -> buka room terkait
navigator.serviceWorker?.addEventListener("message", e => {
  if (e.data?.type === "open-room" && e.data.room) location.hash = e.data.room;
});

/* ---------- Sedang mengetik ---------- */
function dropTyper(uid) {
  const o = typists.get(uid);
  if (o) { clearTimeout(o.timer); typists.delete(uid); }
  paintTyping();
}
function paintTyping() {
  const log = $("log");
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  typEl?.remove(); typEl = null;
  if (!typists.size) return;
  const ids = [...typists.keys()];
  const names = ids.map(u => profiles.get(u)?.name || typists.get(u).name || "Seseorang");
  const label = names.length === 1 ? `${names[0]} sedang mengetik`
    : names.length === 2 ? `${names[0]} dan ${names[1]} sedang mengetik` : `${names.length} orang sedang mengetik`;
  const p = profiles.get(ids[0]) || {};
  const row = document.createElement("div"); row.className = "row typing";
  row.append(avatar(names[0], p.color, "", ids[0], p.photo));
  const col = document.createElement("div"); col.className = "col";
  const who = document.createElement("div"); who.className = "who"; who.textContent = label;
  const b = document.createElement("div"); b.className = "bubble dots";
  b.setAttribute("aria-hidden", "true");
  b.append(document.createElement("span"), document.createElement("span"), document.createElement("span"));
  col.append(who, b); row.append(col);
  typEl = row; log.append(row);
  if (near) log.scrollTop = log.scrollHeight;
}
function stopTyping() {
  clearTimeout(typTimer); typTimer = null; typLast = 0;
  if (typRoom && me) deleteDoc(doc(db, "rooms", typRoom, "typing", me.uid)).catch(() => {});
  typRoom = null;
}
function noteTyping() {
  if (!room || !me) return;
  if (!$("text").value.trim()) return stopTyping();
  const now = Date.now();
  if (typRoom !== room || now - typLast > 2500) {
    typLast = now; typRoom = room;
    setDoc(doc(db, "rooms", room, "typing", me.uid), { name: me.name, ts: serverTimestamp() }).catch(() => {});
  }
  clearTimeout(typTimer); typTimer = setTimeout(stopTyping, 4000);
}
addEventListener("pagehide", stopTyping);

/* ---------- Pesan ---------- */
const fmt = t => new Date(t).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
function render(m) {
  $("note")?.remove();
  const own = m.uid === me.uid;
  const t = m.ts?.toMillis ? m.ts.toMillis() : Date.now();
  const g = last && last.uid === m.uid && t - last.ts < 5 * 60 * 1000;
  last = { uid: m.uid, ts: t };
  const p = profiles.get(m.uid) || {};
  const name = p.name || m.name || "Anonim";

  const row = document.createElement("div");
  row.className = "row" + (own ? " own" : "") + (g ? " g" : "");
  if (!own) {
    if (g) { const s = document.createElement("div"); s.className = "sp"; row.append(s); }
    else row.append(avatar(name, p.color || m.color, "", m.uid, p.photo));
    watchProfile(m.uid);
  }
  const col = document.createElement("div"); col.className = "col";
  if (!own && !g) {
    const w = document.createElement("div"); w.className = "who"; w.dataset.uid = m.uid; w.textContent = name;
    col.append(w);
  }
  const b = document.createElement("div"); b.className = "bubble";
  const tm = document.createElement("span"); tm.className = "time"; tm.textContent = fmt(t);
  const pic = safeImage(m.image);
  if (pic) {
    b.classList.add("hasimg");
    const im = new Image(); im.className = "pic"; im.alt = "Gambar terkirim"; im.decoding = "async"; im.src = pic;
    const iw = Number(m.iw), ih = Number(m.ih);
    if (iw > 0 && ih > 0 && iw <= 2000 && ih <= 2000) { im.style.width = Math.min(iw, 320) + "px"; im.style.aspectRatio = iw + " / " + ih; }
    im.onclick = () => { $("lbImg").src = pic; $("lb").showModal(); };
    b.append(im);
  }
  const cap = document.createElement("div"); cap.className = "cap";
  cap.append(tm, String(m.text ?? ""));
  b.append(cap);
  col.append(b); row.append(col);

  const log = $("log");
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  if (typEl && typEl.parentNode === log) log.insertBefore(row, typEl); else log.append(row);
  if (own || near) log.scrollTop = log.scrollHeight;
}

const text = $("text");
function autosize() {
  text.style.height = "auto";
  text.style.height = Math.min(text.scrollHeight, 140) + "px";
  $("sendBtn").disabled = !text.value.trim() && !pendingImg;
}
text.addEventListener("input", () => { autosize(); noteTyping(); });
text.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(pointer:coarse)").matches) {
    e.preventDefault(); $("form").requestSubmit();
  }
});
/* ---------- Kirim gambar ---------- */
function paintPrev() {
  const on = !!pendingImg && !$("form").hidden;
  $("prev").hidden = !on;
  if (on) {
    $("prevImg").src = pendingImg.data;
    $("prevInfo").textContent = `${pendingImg.w}×${pendingImg.h} px · ${Math.round(pendingImg.data.length * 0.75 / 1024)} KB`;
  }
}
async function setImage(f) {
  if (!f || !f.type.startsWith("image/")) return;
  try { pendingImg = await shrink(f); paintPrev(); }
  catch (err) { console.error(err); toast("Gambar tidak bisa dibaca", "Coba gambar lain (JPG, PNG, atau WebP)."); }
  autosize();
}
$("attach").onclick = () => $("imgFile").click();
$("imgFile").onchange = e => { const f = e.target.files[0]; e.target.value = ""; setImage(f); };
$("prevX").onclick = () => { pendingImg = null; paintPrev(); autosize(); };
text.addEventListener("paste", e => {
  const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith("image/"));
  if (f) { e.preventDefault(); setImage(f); }
});
$("lb").onclick = () => $("lb").close();

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const body = text.value.trim(), img = pendingImg;
  if ((!body && !img) || !room) return;
  const rid = room;
  text.value = ""; pendingImg = null; autosize(); paintPrev(); stopTyping();
  const msg = { uid: me.uid, name: me.name, color: me.color, text: body, ts: serverTimestamp() };
  if (img) { msg.image = img.data; msg.iw = img.w; msg.ih = img.h; }
  try {
    await addDoc(collection(db, "rooms", rid, "messages"), msg);
  } catch (err) {
    console.error(err);
    if (rid === room) { text.value = body; pendingImg = img; autosize(); paintPrev(); }
    alert("Pesan gagal terkirim. Periksa koneksi dan rules Firestore.");
  }
});
