<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Chat Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC; --panel:#FFFFFF; --in:#E9F7F4; --out:#00A884; --on-out:#0B141A; --alt:#1ABC9C;
  --text:#111827; --muted:#64748B; --line:#E2E8F0; --name:#00735F; --err:#C0392B;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0B141A; --panel:#111B21; --in:#202C33; --text:#E9EDEF; --muted:#8696A0; --line:#222E35; --name:#1ABC9C; --err:#FF8A7A; color-scheme:dark}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--name);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--out);color:var(--on-out)}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.icon{width:40px;height:40px;border:0;border-radius:50%;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.icon:hover{background:var(--in);color:var(--text)}
.field{display:block;margin-bottom:14px;font-size:14px;color:var(--muted)}
.field input,.field textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.err{color:var(--err);font-size:14px;min-height:20px;margin-bottom:10px}

/* Avatar */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none;user-select:none}
.av.lg{width:56px;height:56px;font-size:24px}

/* Masuk / daftar */
.auth{height:100%;display:grid;place-items:center;padding:20px}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}
.card h1{font-size:22px;font-weight:700;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.card .btn{width:100%}

/* Aplikasi */
.app{display:grid;grid-template-columns:320px 1fr;height:100dvh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-h{display:flex;align-items:center;gap:6px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.me{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px;border-radius:12px;cursor:pointer;text-align:left}
.me:hover{background:var(--in)}
.me b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side h2{font-size:13px;font-weight:600;color:var(--muted);padding:16px 18px 6px}
#rooms{overflow-y:auto;padding:0 8px 12px;flex:1}
.room{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:500}
.room:hover{background:var(--in)}
.room.on{background:var(--in);font-weight:700}
.room i{width:34px;height:34px;border-radius:10px;background:var(--in);color:var(--name);display:grid;place-items:center;font-style:normal;font-weight:700;flex:none}
.room.on i{background:var(--out);color:var(--on-out)}
.room span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chat{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.chat header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:62px}
.chat h2{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{display:none}
#log{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px max(14px,env(safe-area-inset-right,0px)) 16px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;scrollbar-width:thin}
.note{margin:auto;color:var(--muted);text-align:center;font-size:14px;max-width:34ch}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:10px;max-width:min(78%,560px)}
.row.g{margin-top:2px}
.row.own{align-self:flex-end;flex-direction:row-reverse}
.sp{width:34px;flex:none}
.col{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.own .col{align-items:flex-end}
.who{font-size:12.5px;font-weight:600;color:var(--name);margin:0 6px 3px}
.bubble{display:flow-root;background:var(--in);padding:8px 12px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.own .bubble{background:var(--out);color:var(--on-out)}
.time{float:right;margin:8px 0 -3px 12px;font-size:11px;color:var(--muted);white-space:nowrap}
.own .time{color:rgba(11,20,26,.72)}
.send{display:flex;align-items:flex-end;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-top:1px solid var(--line)}
.send textarea{flex:1;resize:none;max-height:140px;line-height:1.4;padding:10px 16px;border-radius:22px;border:1px solid var(--line);background:var(--bg)}
.send .btn{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;flex:none}

dialog{margin:auto;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);padding:24px;width:min(380px,calc(100% - 32px))}
dialog::backdrop{background:rgba(8,12,16,.5)}
dialog h2{font-size:18px;margin-bottom:16px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px var(--panel)}
.sw button[aria-pressed=true]{border-color:var(--text)}
.pv{display:flex;align-items:center;gap:14px;margin-bottom:16px}

@media (max-width:759px){
  .app{grid-template-columns:1fr}
  .chat{display:none}
  body.in .side{display:none}
  body.in .chat{display:flex}
  #back{display:grid}
  .row{max-width:86%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="auth" id="auth" hidden>
  <div class="card">
    <h1>Selamat datang</h1>
    <p class="sub">Masukkan nama untuk mulai.</p>
    <form id="authForm">
      <label class="field">Nama<input id="aName" maxlength="24" autocomplete="nickname" required autofocus></label>
      <p class="err" id="aErr" role="alert"></p>
      <button class="btn" id="aGo" type="submit">Mulai</button>
    </form>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side-h">
      <button class="me" id="meBtn" type="button" title="Ubah profil"><span id="meAv"></span><span style="min-width:0"><b id="meName"></b><small id="meBio"></small></span></button>
      
    </div>
    <h2>Room</h2>
    <nav id="rooms" aria-label="Daftar room"></nav>
    <div style="padding:12px"><button class="btn ghost" id="newBtn" type="button" style="width:100%">Buat room baru</button></div>
  </aside>
  <section class="chat">
    <header>
      <a class="icon" id="back" href="#" aria-label="Kembali"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <h2 id="title">Obrolan</h2>
    </header>
    <main id="log" aria-live="polite"></main>
    <form class="send" id="form" hidden>
      <textarea id="text" rows="1" maxlength="500" placeholder="Tulis pesan" aria-label="Pesan"></textarea>
      <button class="btn" id="sendBtn" type="submit" aria-label="Kirim" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6v6.5L15 12 3.4 13.9z"/></svg></button>
    </form>
  </section>
</div>

<dialog id="pDlg">
  <form id="pForm">
    <h2>Profil kamu</h2>
    <div class="pv"><span id="pAv"></span><span style="color:var(--muted);font-size:14px">Pilih warna avatar</span></div>
    <div class="sw" id="sw"></div>
    <label class="field">Nama<input id="pName" maxlength="24" required></label>
    <label class="field">Tentang kamu<textarea id="pBio" maxlength="80" rows="2" style="resize:none"></textarea></label>
    <p class="err" id="pErr" role="alert"></p>
    <div class="acts"><button class="btn ghost" type="button" id="pCancel">Batal</button><button class="btn" type="submit">Simpan</button></div>
  </form>
</dialog>

<dialog id="rDlg">
  <form id="rForm">
    <h2>Room baru</h2>
    <label class="field">Nama room<input id="rName" maxlength="30" placeholder="Contoh: Nongkrong" required></label>
    <p class="err" id="rErr" role="alert"></p>
    <div class="acts"><button class="btn ghost" type="button" id="rCancel">Batal</button><button class="btn" type="submit">Buat</button></div>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, orderBy, limitToLast, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDGrsU8WsmF6QJ5p-CYU1yyLup7FZCJMMo",
  authDomain: "profiled-chat.firebaseapp.com",
  projectId: "profiled-chat",
  storageBucket: "profiled-chat.firebasestorage.app",
  messagingSenderId: "502631034180",
  appId: "1:502631034180:web:fe6bd48fc065f6b9bfbb11",
  measurementId: "G-31EHMFW9EP"
});
const auth = getAuth(app), db = getFirestore(app);

const $ = id => document.getElementById(id);
const COLORS = ["#00A884", "#0E7C86", "#3B82F6", "#8B5CF6", "#D9468F", "#E26D2F", "#C0392B", "#64748B"];

let me = null, pendingName = null;
let rooms = [], room = null, unsubRooms = null, unsubMsgs = null, last = null;

const initial = s => (Array.from((s || "?").trim())[0] || "?").toUpperCase();
function avatar(name, color, cls = "") {
  const d = document.createElement("div");
  d.className = "av " + cls;
  d.style.background = color || COLORS[0];
  d.textContent = initial(name);
  return d;
}

/* ---------- Nama (tanpa email) ---------- */
function showWelcome(msg = "") {
  me = null; $("app").hidden = true; $("auth").hidden = false;
  $("aErr").textContent = msg; $("aGo").disabled = false; $("aName").focus();
}

async function load(u) {
  const ref = doc(db, "users", u.uid);
  try {
    let s = await getDoc(ref);
    if (!s.exists()) {
      if (!pendingName) return showWelcome();
      await setDoc(ref, {
        name: pendingName.slice(0, 24), bio: "",
        color: COLORS[Math.floor(Math.random() * COLORS.length)], createdAt: serverTimestamp()
      });
      s = await getDoc(ref);
    }
    me = { uid: u.uid, ...s.data() };
  } catch (err) {
    console.error(err); pendingName = null;
    return showWelcome("Tidak bisa terhubung ke database. Periksa koneksi dan rules Firestore.");
  }
  pendingName = null; start();
}

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("aName").value.trim();
  if (!name) return;
  pendingName = name; $("aGo").disabled = true; $("aErr").textContent = "";
  try {
    if (auth.currentUser) await load(auth.currentUser);
    else await signInAnonymously(auth);
  } catch (err) {
    pendingName = null; $("aGo").disabled = false;
    $("aErr").textContent = err.code === "auth/operation-not-allowed"
      ? "Login anonim belum diaktifkan di Firebase Console."
      : err.code === "auth/network-request-failed" ? "Tidak ada koneksi internet." : "Gagal masuk. Coba lagi.";
  }
});

// Firebase menyimpan sesi anonim di perangkat, jadi kunjungan berikutnya langsung masuk
onAuthStateChanged(auth, u => u ? load(u) : showWelcome());

/* ---------- Profil ---------- */
let pickColor = COLORS[0];
function paintSw() {
  $("sw").replaceChildren(...COLORS.map(c => {
    const b = document.createElement("button");
    b.type = "button"; b.style.background = c; b.setAttribute("aria-label", "Warna " + c);
    b.setAttribute("aria-pressed", String(c === pickColor));
    b.onclick = () => { pickColor = c; paintSw(); paintPv(); };
    return b;
  }));
}
const paintPv = () => $("pAv").replaceChildren(avatar($("pName").value || me.name, pickColor, "lg"));
function paintMe() {
  $("meAv").replaceChildren(avatar(me.name, me.color));
  $("meName").textContent = me.name;
  $("meBio").textContent = me.bio || "Ubah profil";
}
$("meBtn").onclick = () => {
  pickColor = me.color; $("pName").value = me.name; $("pBio").value = me.bio || "";
  $("pErr").textContent = ""; paintSw(); paintPv(); $("pDlg").showModal();
};
$("pName").addEventListener("input", paintPv);
$("pCancel").onclick = () => $("pDlg").close();
$("pForm").addEventListener("submit", async e => {
  e.preventDefault();
  const p = { name: $("pName").value.trim(), bio: $("pBio").value.trim(), color: pickColor, updatedAt: serverTimestamp() };
  if (!p.name) return;
  try {
    await setDoc(doc(db, "users", me.uid), p, { merge: true });
    Object.assign(me, p); paintMe(); $("pDlg").close();
  } catch (err) { console.error(err); $("pErr").textContent = "Profil gagal disimpan. Periksa rules Firestore."; }
});

/* ---------- Room ---------- */
$("newBtn").onclick = () => { $("rName").value = ""; $("rErr").textContent = ""; $("rDlg").showModal(); $("rName").focus(); };
$("rCancel").onclick = () => $("rDlg").close();
$("rForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("rName").value.trim();
  if (!name) return;
  try {
    const r = await addDoc(collection(db, "rooms"), { name, createdBy: me.uid, createdAt: serverTimestamp() });
    $("rDlg").close(); location.hash = r.id;
  } catch (err) { console.error(err); $("rErr").textContent = "Room gagal dibuat. Periksa rules Firestore."; }
});

function paintRooms() {
  $("rooms").replaceChildren(...rooms.map(r => {
    const a = document.createElement("a");
    a.className = "room" + (r.id === room ? " on" : "");
    a.href = "#" + r.id;
    const i = document.createElement("i"); i.textContent = "#";
    const s = document.createElement("span"); s.textContent = r.name;
    a.append(i, s);
    return a;
  }));
  if (room) $("title").textContent = rooms.find(r => r.id === room)?.name || "Room";
}

function showNote(msg) {
  const p = document.createElement("p"); p.className = "note"; p.id = "note"; p.textContent = msg;
  $("log").replaceChildren(p);
}

function route() {
  if (!me) return;
  const id = location.hash.slice(1);
  unsubMsgs?.(); unsubMsgs = null; last = null;
  room = id || null;
  document.body.classList.toggle("in", !!id);
  $("form").hidden = !id;
  paintRooms();
  if (!id) { $("title").textContent = "Obrolan"; showNote("Pilih room di samping, atau buat room baru."); return; }
  showNote("Belum ada pesan di room ini. Mulai obrolan.");
  unsubMsgs = onSnapshot(
    query(collection(db, "rooms", id, "messages"), orderBy("ts"), limitToLast(100)),
    snap => snap.docChanges().forEach(c => { if (c.type === "added") render(c.doc.data({ serverTimestamps: "estimate" })); }),
    err => { console.error(err); showNote("Pesan tidak bisa dimuat. Periksa rules Firestore."); }
  );
  if (matchMedia("(min-width:760px)").matches) $("text").focus();
}
addEventListener("hashchange", route);

function start() {
  $("auth").hidden = true; $("app").hidden = false;
  paintMe();
  unsubRooms?.();
  let seeded = false;
  unsubRooms = onSnapshot(query(collection(db, "rooms"), orderBy("createdAt")), snap => {
    rooms = snap.docs.map(d => ({ id: d.id, name: d.data().name }));
    if (!rooms.length && !seeded) {
      seeded = true;
      setDoc(doc(db, "rooms", "umum"), { name: "Umum", createdBy: me.uid, createdAt: serverTimestamp() }).catch(console.error);
    }
    if (!location.hash && rooms.length && matchMedia("(min-width:760px)").matches) {
      location.replace("#" + rooms[0].id);
    } else if (!room || !location.hash) { route(); } else { paintRooms(); }
  }, err => { console.error(err); $("rooms").textContent = "Room tidak bisa dimuat. Periksa rules Firestore."; });
  route();
}

/* ---------- Pesan ---------- */
const fmt = t => new Date(t).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
function render(m) {
  $("note")?.remove();
  const own = m.uid === me.uid;
  const t = m.ts?.toMillis ? m.ts.toMillis() : Date.now();
  const g = last && last.uid === m.uid && t - last.ts < 5 * 60 * 1000;
  last = { uid: m.uid, ts: t };

  const row = document.createElement("div");
  row.className = "row" + (own ? " own" : "") + (g ? " g" : "");
  if (!own) {
    if (g) { const s = document.createElement("div"); s.className = "sp"; row.append(s); }
    else row.append(avatar(m.name, m.color));
  }
  const col = document.createElement("div"); col.className = "col";
  if (!own && !g) { const w = document.createElement("div"); w.className = "who"; w.textContent = m.name || "Anonim"; col.append(w); }
  const b = document.createElement("div"); b.className = "bubble";
  const tm = document.createElement("span"); tm.className = "time"; tm.textContent = fmt(t);
  b.append(tm, String(m.text ?? ""));
  col.append(b); row.append(col);

  const log = $("log");
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  log.append(row);
  if (own || near) log.scrollTop = log.scrollHeight;
}

const text = $("text");
function autosize() {
  text.style.height = "auto";
  text.style.height = Math.min(text.scrollHeight, 140) + "px";
  $("sendBtn").disabled = !text.value.trim();
}
text.addEventListener("input", autosize);
text.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(pointer:coarse)").matches) {
    e.preventDefault(); $("form").requestSubmit();
  }
});
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const body = text.value.trim();
  if (!body || !room) return;
  text.value = ""; autosize();
  try {
    await addDoc(collection(db, "rooms", room, "messages"),
      { uid: me.uid, name: me.name, color: me.color, text: body, ts: serverTimestamp() });
  } catch (err) {
    console.error(err);
    text.value = body; autosize();
    alert("Pesan gagal terkirim. Periksa koneksi dan rules Firestore.");
  }
});
</script>
</body>
</html>
